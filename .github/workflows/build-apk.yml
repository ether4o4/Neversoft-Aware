name: Build and Publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neversoft-aware-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize encoded sources
        run: bash scripts/materialize.sh

      - name: Validate CLI sources
        run: |
          base64 -d encoded/ns_py.b64 > /tmp/ns.py
          python -m py_compile /tmp/ns.py
          base64 -d encoded/install_payload_v2.b64 > /tmp/install.sh
          bash -n /tmp/install.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NeverSoft-Aware.apk
          sha256sum NeverSoft-Aware.apk > NeverSoft-Aware.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeverSoft-Aware-APK
          path: |
            NeverSoft-Aware.apk
            NeverSoft-Aware.apk.sha256

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NeverSoft-Aware.apk NeverSoft-Aware.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "NeverSoft Aware — Latest APK" \
            --notes "Installable Android debug APK built automatically from main. SHA-256 is attached." \
            --latest
